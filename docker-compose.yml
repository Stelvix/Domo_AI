services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ollama-pixel-office
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/office.db
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - CORS_ORIGIN=http://localhost:3001
      - SERVE_STATIC=true
      # IP LAN de la machine hôte : c'est la seule adresse joignable depuis un
      # smartphone (les interfaces du conteneur sont inaccessibles depuis le LAN).
      # Injectée par scripts/docker-up.sh (npm run docker:up) qui la détecte.
      - HOST_LAN_IP=${HOST_LAN_IP:-}
    volumes:
      - aoc_data:/app/data
    extra_hosts:
      # Permet au conteneur de communiquer directement avec le serveur Ollama de la machine hôte
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/api/health | grep -q '\"status\":\"ok\"' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  aoc_data:
    driver: local
