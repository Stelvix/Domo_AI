name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop", "feat/**" ]
  pull_request:
    branches: [ "main", "master", "develop", "feat/**" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: Backend Lint, Prisma & Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./dev.db"
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Prepare Environment File
        run: cp backend/.env.example backend/.env

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate --schema=backend/prisma/schema.prisma

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Run Backend Test Suite
        run: npm test

      - name: Run Backend Syntax Check
        run: node --check backend/src/server.js && node --check backend/src/app.js

  frontend-checks:
    name: Frontend Typecheck, PWA & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build & Typecheck Vue PWA
        run: npm run build --workspace=frontend

  docker-build:
    name: Docker Production Container Build
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ollama-pixel-office:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  production-smoke-test:
    name: Production Image Smoke Test
    runs-on: ubuntu-latest
    needs: [docker-build]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Production Image
        run: docker build -t ollama-pixel-office:ci .

      - name: Start Production Container
        run: |
          docker run -d --name aoc-smoke \
            -e DATABASE_URL="file:/app/data/office.db" \
            -e SERVE_STATIC="true" \
            -e NODE_ENV="production" \
            -p 3001:3001 \
            ollama-pixel-office:ci

      - name: Wait for API Readiness
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:3001/api/health > /dev/null; then
              echo "API prête après ${i} tentatives."
              exit 0
            fi
            sleep 2
          done
          echo "::error::L'API n'a pas démarré dans les temps."
          docker logs aoc-smoke
          exit 1

      - name: Assert API Health Contract
        run: |
          curl -sf http://127.0.0.1:3001/api/health | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          grep -q '"ollama"' /tmp/health.json

      - name: Assert PWA Assets Are Served
        run: |
          curl -sf http://127.0.0.1:3001/ | grep -q 'id="root"'
          curl -sf -o /dev/null http://127.0.0.1:3001/sw.js
          curl -sf -o /dev/null http://127.0.0.1:3001/manifest.webmanifest

      - name: Assert API Routes Respond
        run: |
          # GET /api/agents doit répondre 200 (Ollama absent => agents hors-ligne, pas d'erreur 5xx)
          curl -sf http://127.0.0.1:3001/api/agents | grep -q '"success":true'
          # Une route inconnue doit répondre 404 (et non 500)
          http_code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3001/api/unknown-route)
          echo "404 attendu, reçu : $http_code"
          test "$http_code" = "404"

      - name: Dump Container Logs On Failure
        if: failure()
        run: docker logs aoc-smoke

      - name: Cleanup
        if: always()
        run: docker rm -f aoc-smoke || true
