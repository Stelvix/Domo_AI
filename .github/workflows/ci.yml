name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop", "feat/**" ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: Backend Lint, Prisma & Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "file:./dev.db"
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Prepare Environment File
        run: cp backend/.env.example backend/.env

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Validate Prisma Schema
        run: npx prisma validate --schema=backend/prisma/schema.prisma

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Run Backend Syntax Check
        run: node --check backend/src/server.js && node --check backend/src/app.js

  frontend-checks:
    name: Frontend Typecheck, PWA & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build & Typecheck Vue PWA
        run: npm run build --workspace=frontend

  docker-build:
    name: Docker Production Container Build
    runs-on: ubuntu-latest
    needs: [backend-checks, frontend-checks]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Docker Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ollama-pixel-office:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
